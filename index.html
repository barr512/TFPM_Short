<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TFPM guided tree fruit pest management knowledge prototype" />
  <title>TFPM Short</title>
  <style>
    :root{--bg:#f4f7f2;--surface:#fff;--surface-soft:#edf3ea;--text:#1f2d24;--muted:#66736b;--border:#d7e0d9;--accent:#315f3c;--accent-dark:#24492d;--shadow:0 18px 50px rgba(40,65,48,.10)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,rgba(91,132,100,.13),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}.app-shell{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 64px}.app-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.7rem);line-height:.95}.text-button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:8px}.breadcrumb{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:18px;color:var(--muted);font-size:.9rem}.breadcrumb button{border:0;background:transparent;color:var(--accent);font-weight:750;padding:0}.hero{margin-bottom:28px}.hero h2{margin:0 0 10px;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.04em}.hero>p{margin:0 0 22px;color:var(--muted);font-size:1.05rem;line-height:1.6}.search-panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:16px}textarea{width:100%;min-height:105px;resize:vertical;border:0;outline:0;color:var(--text);background:transparent;font-size:1.08rem;line-height:1.5}textarea::placeholder{color:#94a097}.search-actions{display:flex;justify-content:flex-end;align-items:center;border-top:1px solid var(--border);padding-top:13px}.primary-button{flex:0 0 auto;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 21px;font-weight:800}.primary-button:hover{background:var(--accent-dark)}.conversation{display:grid;gap:16px}.message{border-radius:18px;padding:18px 20px;border:1px solid var(--border);background:var(--surface)}.message.user{margin-left:min(120px,14vw);background:var(--accent);color:white;border-color:var(--accent)}.message.assistant{margin-right:min(80px,10vw)}.message-label{margin-bottom:8px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.message.user .message-label{color:rgba(255,255,255,.72)}.message-body{line-height:1.6}.message-body p{margin:0 0 12px}.message-body p:last-child{margin-bottom:0}.option-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.option-button{border:1px solid #afc1b3;border-radius:999px;background:var(--surface-soft);color:var(--accent-dark);padding:10px 15px;font-weight:750}.option-button:hover{background:#dde9dd;border-color:#8ca391}.refinement-box{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}.refinement-box label{display:block;font-weight:750;margin-bottom:8px}.refinement-row{display:flex;gap:10px}.refinement-row input{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px 13px;outline:none}.answer-card{background:#f8faf7;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:14px 0}.answer-card h3{margin:0 0 8px;font-size:1rem}.source-list{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem}.source-list a{color:var(--accent-dark);font-weight:700}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:640px){.app-shell{width:min(100% - 18px,920px);padding-top:18px}.message.user,.message.assistant{margin-left:0;margin-right:0}.refinement-row{flex-direction:column}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div><p class="eyebrow">Tree Fruit Pest Management</p><h1>TFPM Short</h1></div><button id="restartBtn" class="text-button" type="button">Home</button></header>
    <nav id="breadcrumb" class="breadcrumb" aria-label="Current topic"></nav>
    <section class="hero">
      <h2>How can I help?</h2>
      <p>Please use the search below for any topic or question related to tree fruit.</p>
      <form id="searchForm" class="search-panel"><label class="sr-only" for="searchInput">Enter your question or topic</label><textarea id="searchInput" rows="3" placeholder="Enter your question or topic..." autocomplete="off"></textarea><div class="search-actions"><button class="primary-button" type="submit">Continue</button></div></form>
    </section>
    <section id="conversation" class="conversation" aria-live="polite"></section>
  </main>
  <template id="messageTemplate"><article class="message"><div class="message-label"></div><div class="message-body"></div></article></template>
  <script>
    const searchForm=document.getElementById('searchForm'),searchInput=document.getElementById('searchInput'),conversation=document.getElementById('conversation'),restartBtn=document.getElementById('restartBtn'),breadcrumb=document.getElementById('breadcrumb'),messageTemplate=document.getElementById('messageTemplate');
    const sources={psu:{name:'Penn State Extension — Tree Fruit Insect Pest: Codling Moth',url:'https://extension.psu.edu/tree-fruit-insect-pest-codling-moth'},cornell:{name:'Cornell IPM — Codling Moth Fact Sheet',url:'https://cals.cornell.edu/integrated-pest-management/outreach-education/fact-sheets/codling-moth-cydia-pomonella'},newa:{name:'Cornell NEWA — Crop and Pest Management Models',url:'https://newa.cornell.edu/crop-and-pest-management'}};
    const tree={
      codling:{label:'Codling moth',children:['Biology','Identification','Monitoring','Degree-day timing','Damage','Insecticides','Mating disruption','Resistance management']},
      monitoring:{label:'Monitoring',children:['Trap placement','Trap density','Trap types','Lures','Biofix','Monitoring under mating disruption','Trap interpretation','Degree-day models']}
    };
    let context=[];
    function addMessage(role,html){const node=messageTemplate.content.cloneNode(true),article=node.querySelector('.message');article.classList.add(role);node.querySelector('.message-label').textContent=role==='user'?'You':'TFPM';node.querySelector('.message-body').innerHTML=html;conversation.appendChild(node);article.scrollIntoView({behavior:'smooth',block:'nearest'});return article}
    function normalize(v){return v.trim().toLowerCase()}
    function escapeHtml(v){return v.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
    function setContext(parts){context=parts;renderBreadcrumb();updatePlaceholder()}
    function renderBreadcrumb(){breadcrumb.innerHTML='';const home=document.createElement('button');home.textContent='Home';home.onclick=reset;breadcrumb.appendChild(home);context.forEach((part,i)=>{breadcrumb.append(' › ');const b=document.createElement('button');b.textContent=part;b.onclick=()=>goToContext(i);breadcrumb.appendChild(b)})}
    function updatePlaceholder(){searchInput.placeholder=context.length?`Ask another question about ${context[context.length-1]}...`:'Enter your question or topic...'}
    function goToContext(i){conversation.innerHTML='';setContext(context.slice(0,i+1));if(context[0]==='Codling moth'&&context[1]==='Monitoring')showMonitoringMenu();else if(context[0]==='Codling moth')showCodlingMenu()}
    function refinementBox(label,placeholder){return `<form class="refinement-box"><label>${escapeHtml(label)}</label><div class="refinement-row"><input type="text" placeholder="${escapeHtml(placeholder)}"><button class="primary-button" type="submit">Continue</button></div></form>`}
    function wire(article){article.querySelectorAll('[data-option]').forEach(button=>button.onclick=()=>processEntry(button.dataset.option));const form=article.querySelector('.refinement-box');if(form)form.onsubmit=e=>{e.preventDefault();const v=form.querySelector('input').value.trim();if(v)processEntry(v)}}
    function showCodlingMenu(){setContext(['Codling moth']);const buttons=tree.codling.children.map(x=>`<button class="option-button" data-option="${x}">${x}</button>`).join('');const a=addMessage('assistant',`<p><strong>What would you like to know about codling moth?</strong></p><div class="option-grid">${buttons}</div>${refinementBox('Ask another question about codling moth','Enter a codling moth question...')}`);wire(a)}
    function showMonitoringMenu(){setContext(['Codling moth','Monitoring']);const buttons=tree.monitoring.children.map(x=>`<button class="option-button" data-option="${x}">${x}</button>`).join('');const a=addMessage('assistant',`<p><strong>What would you like to know about codling moth monitoring?</strong></p><div class="option-grid">${buttons}</div>${refinementBox('Ask another monitoring question','Enter a monitoring question...')}`);wire(a)}
    function renderAnswer(title,answer,sourceList){const items=sourceList.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.name)}</a></li>`).join('');const a=addMessage('assistant',`<div class="answer-card"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(answer)}</p></div>${items?`<strong>Sources</strong><ul class="source-list">${items}</ul>`:''}${refinementBox(`Ask another question about ${context[context.length-1]||'this topic'}`,'Enter another question...')}`);wire(a)}
    function answerMonitoring(text){if(/trap placement|where.*trap|place.*trap/.test(text)){renderAnswer('Codling moth trap placement','Place traps in the upper portion of the canopy where codling moth activity is more likely to be detected. Penn State advises placement in the upper fourth of the tree canopy, on the outside of the tree. Placement details may differ under mating disruption.',[sources.psu,sources.cornell]);return true}if(/trap density|how many trap|traps per/.test(text)){renderAnswer('Codling moth trap density','Penn State advises at least one trap per 5 acres, with no fewer than two traps per block. Higher-risk or irregular blocks may need additional traps for representative coverage.',[sources.psu]);return true}if(/biofix|first catch|sustained catch/.test(text)){renderAnswer('Codling moth biofix','Biofix is the biological starting point used by many degree-day models. Cornell describes it as the date of first sustained moth catch. Regional models may define or apply biofix differently.',[sources.cornell,sources.newa]);return true}if(/mating disruption|disrupted orchard|combo lure|high dose/.test(text)){renderAnswer('Monitoring under mating disruption','Standard pheromone catches may be suppressed in mating-disruption blocks. High-load or combination lures are commonly used, and trap results should be interpreted together with placement, orchard history, and fruit injury observations.',[sources.psu,sources.cornell]);return true}if(/monitor|trap|lure|scout|interpret/.test(text)){renderAnswer('Codling moth monitoring','Use pheromone traps to detect adult flight and help establish biofix. Check traps frequently until first catch, then continue on a regular schedule. Trap type, lure, placement, mating-disruption status, and orchard history all affect interpretation.',[sources.psu,sources.cornell]);return true}return false}
    function processEntry(value){addMessage('user',`<p>${escapeHtml(value)}</p>`);searchInput.value='';const text=normalize(value);if(/codling moth/.test(text)&&/monitor|trap|lure|biofix|scout/.test(text)){setContext(['Codling moth','Monitoring']);if(!answerMonitoring(text))showMonitoringMenu();else renderBreadcrumb();return}if(context[0]==='Codling moth'&&context[1]==='Monitoring'){if(answerMonitoring(text))return;if(text==='monitoring'){showMonitoringMenu();return}}
      if(text==='monitoring'&&context[0]==='Codling moth'){showMonitoringMenu();return}
      if(text==='codling moth'){showCodlingMenu();return}
      if(context[0]==='Codling moth'){if(/degree|egg hatch|timing/.test(text)){setContext(['Codling moth','Degree-day timing']);renderAnswer('Codling moth degree-day timing','Codling moth development is commonly tracked with a base-50°F model, but starting points and thresholds differ by region. The app should ask for the user’s regional model before presenting a timing value.',[sources.newa,sources.cornell]);return}if(/damage|injury/.test(text)){setContext(['Codling moth','Damage']);renderAnswer('Codling moth damage','Larvae enter fruit and may feed toward the seed cavity. Entry holes, frass, premature fruit drop, and internal feeding are typical signs.',[sources.psu,sources.cornell]);return}}
      if(/codling moth/.test(text)){showCodlingMenu();return}
      addMessage('assistant',`<p>The current test knowledge set is limited to codling moth. Try entering <strong>Codling moth</strong> or <strong>Codling moth monitoring</strong>.</p>`)
    }
    function reset(){conversation.innerHTML='';setContext([]);searchInput.value='';searchInput.focus()}
    searchForm.onsubmit=e=>{e.preventDefault();const v=searchInput.value.trim();if(v)processEntry(v)};restartBtn.onclick=reset;setContext([]);searchInput.focus();
  </script>
</body>
</html>
