<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TFPM Short</title>
<style>
:root{--bg:#f4f7f2;--surface:#fff;--soft:#edf3ea;--text:#1f2d24;--muted:#66736b;--border:#d7e0d9;--accent:#315f3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(920px,calc(100% - 28px));margin:auto;padding:28px 0 64px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.7rem);line-height:.95}.text-btn{border:0;background:transparent;color:var(--accent);font-weight:700}.hero h2{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 10px}.hero>p{color:var(--muted);line-height:1.6}.search{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(40,65,48,.1)}textarea{width:100%;min-height:105px;border:0;outline:0;resize:vertical;font:inherit;font-size:1.08rem;background:transparent}.actions{display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:13px}.primary{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:12px 21px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.58;cursor:wait}.conversation{display:grid;gap:16px;margin-top:28px}.message{border:1px solid var(--border);border-radius:18px;background:#fff;padding:18px 20px}.message.user{margin-left:min(120px,14vw);background:var(--accent);color:#fff}.label{margin-bottom:8px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.user .label{color:rgba(255,255,255,.75)}.body{line-height:1.62}.body p{margin:0 0 12px}.answer{background:#f8faf7;border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px}.answer p:last-child{margin-bottom:0}.refine{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}.refine label{display:block;font-weight:750;margin-bottom:8px}.row{display:flex;gap:10px}.row input{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px 13px;font:inherit}.diagnostics{margin-top:14px;border:1px dashed #aebbb1;border-radius:12px;background:#f7f9f6;padding:12px 14px;color:var(--muted);font-size:.86rem}.diagnostics summary{cursor:pointer;color:var(--accent);font-weight:800}.diagnostics dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;margin:12px 0 0}.diagnostics dt{font-weight:750}.diagnostics dd{margin:0;overflow-wrap:anywhere}.status{color:var(--muted);font-style:italic}@media(max-width:640px){.message.user{margin-left:0}.row{flex-direction:column}.diagnostics dl{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<header class="head"><div><p class="eyebrow">Tree Fruit Pest Management</p><h1>TFPM Short</h1></div><button id="home" class="text-btn" type="button">Home</button></header>
<section class="hero"><h2>How can I help?</h2><p>Please use the search below for any topic or question relating to tree fruit.</p><form id="search" class="search"><textarea id="input" placeholder="Enter your question or topic..."></textarea><div class="actions"><button id="continueBtn" class="primary" type="submit">Continue</button></div></form></section>
<section id="conversation" class="conversation" aria-live="polite"></section>
</main>
<script>
const API_URL='https://tfpm-api.brentshortusda.workers.dev/ask';
const input=document.getElementById('input');
const conversation=document.getElementById('conversation');
const continueBtn=document.getElementById('continueBtn');
let knownContext={};
let pendingQuestion='';
let pendingMissing=[];

function esc(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function paragraphs(text){return String(text||'').split(/\n{2,}/).filter(Boolean).map(part=>`<p>${esc(part)}</p>`).join('')}
function addMessage(role,html){const article=document.createElement('article');article.className='message '+role;article.innerHTML=`<div class="label">${role==='user'?'You':'TFPM'}</div><div class="body">${html}</div>`;conversation.appendChild(article);article.scrollIntoView({behavior:'smooth',block:'nearest'});return article}
function followupBox(label,placeholder){return `<form class="refine"><label>${esc(label)}</label><div class="row"><input autocomplete="off" placeholder="${esc(placeholder)}"><button class="primary" type="submit">Continue</button></div></form>`}
function wireFollowup(article){const form=article.querySelector('.refine');if(!form)return;form.onsubmit=e=>{e.preventDefault();const value=form.querySelector('input').value.trim();if(value)handleEntry(value,true)}}
function diagnostics(data){const records=(data.retrieved_record_ids||[]).join(', ')||'None';const missing=(data.missing_context||[]).join(', ')||'None';return `<details class="diagnostics"><summary>Developer details</summary><dl><dt>Status</dt><dd>${esc(data.status||'unknown')}</dd><dt>Target</dt><dd>${esc(data.detected?.target||knownContext.target||'Not detected')}</dd><dt>Domain</dt><dd>${esc(data.detected?.domain||'Not detected')}</dd><dt>Records</dt><dd>${esc(records)}</dd><dt>Missing</dt><dd>${esc(missing)}</dd><dt>Confidence</dt><dd>${esc(data.confidence||'Not reported')}</dd></dl></details>`}
function parseContextReply(value){const normalized=value.toLowerCase().replace(/\bcm\b/g,'codling moth');
  if(pendingMissing.includes('target')||(!knownContext.target&&/codling moth/.test(normalized)))knownContext.target='codling moth';
  const acres=normalized.match(/(\d+(?:\.\d+)?)\s*(?:acre|acres|ac)\b/);if(acres)knownContext.acreage=Number(acres[1]);
  const blocks=normalized.match(/(\d+)\s*(?:block|blocks)\b/);if(blocks)knownContext.number_of_blocks=Number(blocks[1]);
}
async function askWorker(question){continueBtn.disabled=true;continueBtn.textContent='Thinking…';
  try{
    const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({question,context:knownContext})});
    const raw=await response.text();
    let data;
    try{data=JSON.parse(raw)}catch{throw new Error(`Knowledge service returned an unreadable response (${response.status}).`)}
    if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);
    if(data.status==='needs_clarification'){
      pendingQuestion=question;
      pendingMissing=data.missing_context||[];
      if(!knownContext.target&&/which pest or disease/i.test(data.clarification||''))pendingMissing=['target',...pendingMissing];
      const article=addMessage('assistant',`<p><strong>${esc(data.clarification||'Please provide more detail.')}</strong></p>${followupBox('Add the needed detail','Enter your answer...')}${diagnostics(data)}`);wireFollowup(article);return;
    }
    pendingQuestion='';pendingMissing=[];
    const answer=data.answer||'I do not yet have enough verified information to answer that confidently.';
    addMessage('assistant',`<div class="answer">${paragraphs(answer)}</div>${diagnostics(data)}`);
  }catch(error){
    addMessage('assistant',`<p>I could not reach the TFPM knowledge service. Please try again.</p><p class="status">${esc(error.message)}</p>`);
  }finally{continueBtn.disabled=false;continueBtn.textContent='Continue'}
}
async function handleEntry(value,isFollowup=false){addMessage('user',`<p>${esc(value)}</p>`);input.value='';
  if(isFollowup&&pendingQuestion){parseContextReply(value);const unanswered=pendingMissing.filter(item=>item==='target'?!knownContext.target:item==='acreage'?!Number.isFinite(knownContext.acreage):item==='number_of_blocks'?!Number.isFinite(knownContext.number_of_blocks):false);pendingMissing=unanswered;if(!unanswered.length){await askWorker(pendingQuestion);return}}
  await askWorker(value);
}
function reset(){conversation.innerHTML='';knownContext={};pendingQuestion='';pendingMissing=[];input.value='';input.focus()}
document.getElementById('search').onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(value)handleEntry(value)};
document.getElementById('home').onclick=reset;
reset();
</script></body></html>
