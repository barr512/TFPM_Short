<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TFPM guided tree fruit pest management knowledge prototype" />
  <title>TFPM Short</title>
  <style>
:root {
  --bg: #f4f7f2;
  --surface: #ffffff;
  --surface-soft: #edf3ea;
  --text: #1f2d24;
  --muted: #66736b;
  --border: #d7e0d9;
  --accent: #315f3c;
  --accent-dark: #24492d;
  --shadow: 0 18px 50px rgba(40, 65, 48, 0.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top right, rgba(91, 132, 100, 0.13), transparent 32rem),
    var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, textarea, input { font: inherit; }
button { cursor: pointer; }

.app-shell {
  width: min(920px, calc(100% - 28px));
  margin: 0 auto;
  padding: 28px 0 64px;
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 50px;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(2rem, 7vw, 3.7rem);
  line-height: 0.95;
}

.text-button {
  border: 0;
  background: transparent;
  color: var(--accent);
  font-weight: 700;
  padding: 8px;
}

.hero { margin-bottom: 28px; }

.hero h2 {
  margin: 0 0 10px;
  font-size: clamp(2rem, 6vw, 3.4rem);
  letter-spacing: -0.04em;
}

.hero > p {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.6;
}

.search-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 16px;
}

textarea {
  width: 100%;
  min-height: 105px;
  resize: vertical;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  font-size: 1.08rem;
  line-height: 1.5;
}

textarea::placeholder { color: #94a097; }

.search-actions {
  display: flex;
  gap: 14px;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  padding-top: 13px;
}

.search-actions span {
  color: var(--muted);
  font-size: 0.86rem;
}

.primary-button {
  flex: 0 0 auto;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: white;
  padding: 12px 21px;
  font-weight: 800;
}

.primary-button:hover { background: var(--accent-dark); }

.conversation {
  display: grid;
  gap: 16px;
}

.message {
  border-radius: 18px;
  padding: 18px 20px;
  border: 1px solid var(--border);
  background: var(--surface);
}

.message.user {
  margin-left: min(120px, 14vw);
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.message.assistant { margin-right: min(80px, 10vw); }

.message-label {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.message.user .message-label { color: rgba(255,255,255,.72); }
.message-body { line-height: 1.6; }
.message-body p { margin: 0 0 12px; }
.message-body p:last-child { margin-bottom: 0; }

.option-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}

.option-button {
  border: 1px solid #afc1b3;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--accent-dark);
  padding: 10px 15px;
  font-weight: 750;
}

.option-button:hover {
  background: #dde9dd;
  border-color: #8ca391;
}

.refinement-box {
  margin-top: 16px;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}

.refinement-box label {
  display: block;
  font-weight: 750;
  margin-bottom: 8px;
}

.refinement-row {
  display: flex;
  gap: 10px;
}

.refinement-row input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 13px;
  outline: none;
}

.refinement-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(49, 95, 60, .12);
}

.answer-card {
  background: #f8faf7;
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
}

.answer-card h3 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.source-list {
  margin: 12px 0 0;
  padding-left: 20px;
  color: var(--muted);
  font-size: .92rem;
}

.feedback-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}

.secondary-button {
  border: 1px solid var(--border);
  border-radius: 999px;
  background: white;
  color: var(--text);
  padding: 10px 15px;
  font-weight: 750;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .app-shell { width: min(100% - 18px, 920px); padding-top: 18px; }
  .app-header { margin-bottom: 34px; }
  .search-actions { align-items: flex-end; }
  .search-actions span { max-width: 58%; }
  .message.user, .message.assistant { margin-left: 0; margin-right: 0; }
  .refinement-row { flex-direction: column; }
}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Tree Fruit Pest Management</p>
        <h1>TFPM Short</h1>
      </div>
      <button id="restartBtn" class="text-button" type="button">Start over</button>
    </header>

    <section class="hero">
      <h2>How can I help?</h2>
      <p>Please use the search below for any topic or question related to tree fruit.</p>

      <form id="searchForm" class="search-panel">
        <label class="sr-only" for="searchInput">Enter your question or topic</label>
        <textarea
          id="searchInput"
          rows="3"
          placeholder="Enter your question or topic..."
          autocomplete="off"
        ></textarea>
        <div class="search-actions">
          <span>Enter a topic or ask a complete question.</span>
          <button class="primary-button" type="submit">Continue</button>
        </div>
      </form>
    </section>

    <section id="conversation" class="conversation" aria-live="polite"></section>
  </main>

  <template id="messageTemplate">
    <article class="message">
      <div class="message-label"></div>
      <div class="message-body"></div>
    </article>
  </template>

  <script>
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const conversation = document.getElementById("conversation");
const restartBtn = document.getElementById("restartBtn");
const messageTemplate = document.getElementById("messageTemplate");

const pestTopics = [
  "Biology",
  "Identification",
  "Monitoring",
  "Degree-day timing",
  "Damage",
  "Insecticides",
  "Mating disruption",
  "Resistance management"
];

const diseaseTopics = [
  "Biology",
  "Identification",
  "Monitoring",
  "Infection risk",
  "Cultural management",
  "Fungicides",
  "Resistance management"
];

function addMessage(role, html) {
  const node = messageTemplate.content.cloneNode(true);
  const article = node.querySelector(".message");
  article.classList.add(role);
  node.querySelector(".message-label").textContent = role === "user" ? "You" : "TFPM";
  node.querySelector(".message-body").innerHTML = html;
  conversation.appendChild(node);
  article.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return article;
}

function normalize(value) {
  return value.trim().toLowerCase();
}

function looksLikeQuestion(value) {
  const text = normalize(value);
  return value.includes("?") || /^(what|when|where|which|who|why|how|can|does|do|is|are|should|will)\b/.test(text);
}

function topicType(value) {
  const text = normalize(value);
  if (/(fire blight|apple scab|powdery mildew|sooty blotch|flyspeck|disease|rot)/.test(text)) return "disease";
  if (/(codling moth|oriental fruit moth|plum curculio|scale|aphid|mite|leafroller|stink bug|insect|pest)/.test(text)) return "pest";
  return "unclear";
}

function renderTopicClarification(topic, type) {
  const topics = type === "disease" ? diseaseTopics : pestTopics;
  const buttons = topics.map(label => `<button type="button" class="option-button" data-option="${label}">${label}</button>`).join("");
  const article = addMessage("assistant", `
    <p><strong>What would you like to know about ${escapeHtml(topic)}?</strong></p>
    <p>Choose an option below, or enter more detail in your own words.</p>
    <div class="option-grid">${buttons}</div>
    ${refinementBox("Enter a more specific question or detail...")}
  `);
  wireOptions(article, topic);
  wireRefinement(article);
}

function renderUnclearTopic(topic) {
  const article = addMessage("assistant", `
    <p><strong>I need a little more information about “${escapeHtml(topic)}.”</strong></p>
    <p>Which of these is closest to what you mean?</p>
    <div class="option-grid">
      <button type="button" class="option-button" data-option="Pest or insect">Pest or insect</button>
      <button type="button" class="option-button" data-option="Disease">Disease</button>
      <button type="button" class="option-button" data-option="Insecticide or fungicide">Insecticide or fungicide</button>
      <button type="button" class="option-button" data-option="Monitoring or forecasting">Monitoring or forecasting</button>
    </div>
    ${refinementBox("Add details, a crop, pest, product, location, or question...")}
  `);
  wireOptions(article, topic);
  wireRefinement(article);
}

function answerQuestion(question) {
  const text = normalize(question);

  if (/codling moth/.test(text) && /(monitor|trap|scout)/.test(text)) {
    renderAnswer(
      "Codling moth monitoring",
      "Codling moth is commonly monitored with pheromone traps. Trap placement, lure type, orchard history, mating disruption status, and the date of sustained catch all affect how the information is interpreted. A biofix is typically established from sustained moth capture and then used with a regional degree-day model.",
      ["Commercial tree fruit production guides", "University IPM monitoring resources", "Regional degree-day or forecasting resources"],
      ["Trap placement", "Biofix", "Degree-day timing", "Mating disruption"]
    );
    return;
  }

  if (/codling moth/.test(text) && /(insecticide|spray|control|treat)/.test(text)) {
    const article = addMessage("assistant", `
      <p>I can provide the relevant published information, but I need more detail to give the most useful answer.</p>
      <p><strong>Which part do you need?</strong></p>
      <div class="option-grid">
        <button type="button" class="option-button" data-option="Insecticides listed in production guides">Insecticides listed in production guides</button>
        <button type="button" class="option-button" data-option="Application timing">Application timing</button>
        <button type="button" class="option-button" data-option="Resistance groups">Resistance groups</button>
        <button type="button" class="option-button" data-option="Label restrictions">Label restrictions</button>
      </div>
      ${refinementBox("Add crop, state or region, generation, product, or other details...")}
    `);
    wireOptions(article, "Codling moth");
    wireRefinement(article);
    return;
  }

  if (/(phi|preharvest interval)/.test(text)) {
    const article = addMessage("assistant", `
      <p><strong>Which product and crop are you asking about?</strong></p>
      <p>PHI can differ by crop and label, so both details are needed.</p>
      ${refinementBox("Example: Delegate on apples")}
    `);
    wireRefinement(article);
    return;
  }

  renderAnswer(
    "Most logical answer",
    "I found a likely interpretation of your question, but this early version does not yet contain the full production-guide knowledge base. The completed system will search the selected commercial production guides first, supplement them with university pest information, and cite the sources used.",
    ["Commercial production guides", "Supplemental university resources", "Current product labels when applicable"],
    ["Narrow the topic", "Add a crop", "Add a location", "Ask about monitoring"]
  );
}

function renderAnswer(title, answer, sources, followUps) {
  const sourceItems = sources.map(source => `<li>${escapeHtml(source)}</li>`).join("");
  const followButtons = followUps.map(label => `<button type="button" class="option-button" data-option="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join("");
  const article = addMessage("assistant", `
    <div class="answer-card">
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(answer)}</p>
    </div>
    <strong>Sources this answer would use:</strong>
    <ul class="source-list">${sourceItems}</ul>
    <p style="margin-top:16px"><strong>Was this what you wanted?</strong></p>
    <div class="feedback-row">
      <button type="button" class="secondary-button" data-feedback="yes">Yes</button>
      <button type="button" class="secondary-button" data-feedback="no">Not quite</button>
    </div>
    <div class="option-grid">${followButtons}</div>
    ${refinementBox("Enter more information or clarify what you need...")}
  `);
  wireOptions(article, "");
  wireRefinement(article);
  article.querySelector('[data-feedback="yes"]').addEventListener("click", () => {
    addMessage("assistant", "<p>Glad that answered it. Enter another topic or question whenever you’re ready.</p>");
  });
  article.querySelector('[data-feedback="no"]').addEventListener("click", () => {
    article.querySelector(".refinement-row input").focus();
  });
}

function refinementBox(placeholder) {
  return `
    <form class="refinement-box">
      <label>Or enter more details</label>
      <div class="refinement-row">
        <input type="text" placeholder="${escapeHtml(placeholder)}" />
        <button class="primary-button" type="submit">Continue</button>
      </div>
    </form>
  `;
}

function wireRefinement(article) {
  const form = article.querySelector(".refinement-box");
  if (!form) return;
  form.addEventListener("submit", event => {
    event.preventDefault();
    const input = form.querySelector("input");
    const value = input.value.trim();
    if (!value) return;
    processEntry(value);
  });
}

function wireOptions(article, context) {
  article.querySelectorAll("[data-option]").forEach(button => {
    button.addEventListener("click", () => {
      const selection = button.dataset.option;
      processEntry(context ? `${context}: ${selection}` : selection);
    });
  });
}

function processEntry(value) {
  addMessage("user", `<p>${escapeHtml(value)}</p>`);
  searchInput.value = "";
  if (looksLikeQuestion(value) || value.includes(":")) {
    answerQuestion(value);
    return;
  }
  const type = topicType(value);
  type === "unclear" ? renderUnclearTopic(value) : renderTopicClarification(value, type);
}

function escapeHtml(value) {
  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

searchForm.addEventListener("submit", event => {
  event.preventDefault();
  const value = searchInput.value.trim();
  if (!value) {
    searchInput.focus();
    return;
  }
  processEntry(value);
});

restartBtn.addEventListener("click", () => {
  conversation.innerHTML = "";
  searchInput.value = "";
  searchInput.focus();
});

searchInput.focus();
  </script>
</body>
</html>
