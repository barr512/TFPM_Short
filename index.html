<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TFPM guided tree fruit pest management knowledge prototype" />
  <title>TFPM Short</title>
  <style>
    :root{--bg:#f4f7f2;--surface:#fff;--surface-soft:#edf3ea;--text:#1f2d24;--muted:#66736b;--border:#d7e0d9;--accent:#315f3c;--accent-dark:#24492d;--shadow:0 18px 50px rgba(40,65,48,.10)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,rgba(91,132,100,.13),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}.app-shell{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 64px}.app-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:50px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.7rem);line-height:.95}.text-button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:8px}.hero{margin-bottom:28px}.hero h2{margin:0 0 10px;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.04em}.hero>p{margin:0 0 22px;color:var(--muted);font-size:1.05rem;line-height:1.6}.search-panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:16px}textarea{width:100%;min-height:105px;resize:vertical;border:0;outline:0;color:var(--text);background:transparent;font-size:1.08rem;line-height:1.5}textarea::placeholder{color:#94a097}.search-actions{display:flex;justify-content:flex-end;align-items:center;border-top:1px solid var(--border);padding-top:13px}.primary-button{flex:0 0 auto;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 21px;font-weight:800}.primary-button:hover{background:var(--accent-dark)}.conversation{display:grid;gap:16px}.message{border-radius:18px;padding:18px 20px;border:1px solid var(--border);background:var(--surface)}.message.user{margin-left:min(120px,14vw);background:var(--accent);color:white;border-color:var(--accent)}.message.assistant{margin-right:min(80px,10vw)}.message-label{margin-bottom:8px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.message.user .message-label{color:rgba(255,255,255,.72)}.message-body{line-height:1.6}.message-body p{margin:0 0 12px}.message-body p:last-child{margin-bottom:0}.option-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.option-button{border:1px solid #afc1b3;border-radius:999px;background:var(--surface-soft);color:var(--accent-dark);padding:10px 15px;font-weight:750}.option-button:hover{background:#dde9dd;border-color:#8ca391}.refinement-box{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}.refinement-box label{display:block;font-weight:750;margin-bottom:8px}.refinement-row{display:flex;gap:10px}.refinement-row input{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px 13px;outline:none}.refinement-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,95,60,.12)}.answer-card{background:#f8faf7;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:14px 0}.answer-card h3{margin:0 0 8px;font-size:1rem}.source-list{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem}.source-list a{color:var(--accent-dark);font-weight:700}.feedback-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.secondary-button{border:1px solid var(--border);border-radius:999px;background:white;color:var(--text);padding:10px 15px;font-weight:750}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:640px){.app-shell{width:min(100% - 18px,920px);padding-top:18px}.app-header{margin-bottom:34px}.message.user,.message.assistant{margin-left:0;margin-right:0}.refinement-row{flex-direction:column}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">Tree Fruit Pest Management</p><h1>TFPM Short</h1></div>
      <button id="restartBtn" class="text-button" type="button">Start over</button>
    </header>
    <section class="hero">
      <h2>How can I help?</h2>
      <p>Please use the search below for any topic or question related to tree fruit.</p>
      <form id="searchForm" class="search-panel">
        <label class="sr-only" for="searchInput">Enter your question or topic</label>
        <textarea id="searchInput" rows="3" placeholder="Enter your question or topic..." autocomplete="off"></textarea>
        <div class="search-actions"><button class="primary-button" type="submit">Continue</button></div>
      </form>
    </section>
    <section id="conversation" class="conversation" aria-live="polite"></section>
  </main>
  <template id="messageTemplate"><article class="message"><div class="message-label"></div><div class="message-body"></div></article></template>
  <script>
    const searchForm=document.getElementById("searchForm"),searchInput=document.getElementById("searchInput"),conversation=document.getElementById("conversation"),restartBtn=document.getElementById("restartBtn"),messageTemplate=document.getElementById("messageTemplate");
    const pestTopics=["Biology","Identification","Monitoring","Degree-day timing","Damage","Insecticides","Mating disruption","Resistance management"];
    const diseaseTopics=["Biology","Identification","Monitoring","Infection risk","Cultural management","Fungicides","Resistance management"];
    const sources={
      psu:{name:"Penn State Extension — Tree Fruit Insect Pest: Codling Moth",url:"https://extension.psu.edu/tree-fruit-insect-pest-codling-moth"},
      cornell:{name:"Cornell IPM — Codling Moth Fact Sheet",url:"https://cals.cornell.edu/integrated-pest-management/outreach-education/fact-sheets/codling-moth-cydia-pomonella"},
      newa:{name:"Cornell NEWA — Crop and Pest Management Models",url:"https://newa.cornell.edu/crop-and-pest-management"},
      wsu:{name:"WSU Tree Fruit — Codling Moth Biology and Ecology",url:"https://treefruit.wsu.edu/crop-protection/opm/duplicated-codling-moth-biology-and-ecology/"}
    };
    function addMessage(role,html){const node=messageTemplate.content.cloneNode(true),article=node.querySelector(".message");article.classList.add(role);node.querySelector(".message-label").textContent=role==="user"?"You":"TFPM";node.querySelector(".message-body").innerHTML=html;conversation.appendChild(node);article.scrollIntoView({behavior:"smooth",block:"nearest"});return article}
    function normalize(value){return value.trim().toLowerCase()}
    function looksLikeQuestion(value){const text=normalize(value);return value.includes("?")||/^(what|when|where|which|who|why|how|can|does|do|is|are|should|will)\b/.test(text)}
    function topicType(value){const text=normalize(value);if(/(fire blight|apple scab|powdery mildew|sooty blotch|flyspeck|disease|rot)/.test(text))return"disease";if(/(codling moth|oriental fruit moth|plum curculio|scale|aphid|mite|leafroller|stink bug|insect|pest)/.test(text))return"pest";return"unclear"}
    function refinementBox(placeholder){return`<form class="refinement-box"><label>Or enter more details</label><div class="refinement-row"><input type="text" placeholder="${escapeHtml(placeholder)}"/><button class="primary-button" type="submit">Continue</button></div></form>`}
    function renderTopicClarification(topic,type){const topics=type==="disease"?diseaseTopics:pestTopics,buttons=topics.map(label=>`<button type="button" class="option-button" data-option="${label}">${label}</button>`).join("");const article=addMessage("assistant",`<p><strong>What would you like to know about ${escapeHtml(topic)}?</strong></p><p>Choose an option below, or enter more detail in your own words.</p><div class="option-grid">${buttons}</div>${refinementBox("Enter a more specific question or detail...")}`);wireOptions(article,topic);wireRefinement(article)}
    function renderUnclearTopic(topic){const article=addMessage("assistant",`<p><strong>I need a little more information about “${escapeHtml(topic)}.”</strong></p><p>Which of these is closest to what you mean?</p><div class="option-grid"><button type="button" class="option-button" data-option="Pest or insect">Pest or insect</button><button type="button" class="option-button" data-option="Disease">Disease</button><button type="button" class="option-button" data-option="Insecticide or fungicide">Insecticide or fungicide</button><button type="button" class="option-button" data-option="Monitoring or forecasting">Monitoring or forecasting</button></div>${refinementBox("Add details, a crop, pest, product, location, or question...")}`);wireOptions(article,topic);wireRefinement(article)}
    function answerQuestion(question){
      const text=normalize(question);
      if(/codling moth/.test(text)&&/(monitor|trap|scout)/.test(text)){
        renderAnswer("Codling moth monitoring","Use pheromone traps to detect adult male flight and help establish biofix. Penn State advises at least one trap per 5 acres, with no fewer than two traps per block, placed by pink on the outside of the tree in the upper fourth of the canopy. Check daily until first catch, then weekly. Cornell likewise emphasizes upper-canopy placement and weekly checking. In mating-disruption blocks, use a high-load or combination lure rather than relying on a standard pheromone lure alone.",[sources.psu,sources.cornell],["Trap placement","Biofix","Degree-day timing","Mating disruption"]);return
      }
      if(/codling moth/.test(text)&&/(biofix|first catch|sustained catch)/.test(text)){
        renderAnswer("Codling moth biofix","Biofix is the biological starting point used by many codling moth degree-day models. Cornell describes it as the date of first sustained moth catch, with base-50°F degree days accumulated from that point. Penn State describes first adult capture as the biofix used for its degree-day timing. Because model conventions differ by region, TFPM should always identify which regional model is being used before applying a timing value.",[sources.cornell,sources.psu,sources.newa],["Degree-day timing","Trap checking frequency","Which regional model?"]);return
      }
      if(/codling moth/.test(text)&&/(degree|timing|egg hatch|when)/.test(text)){
        renderAnswer("Codling moth degree-day timing","Codling moth development is commonly tracked with a base-50°F degree-day model, but the starting point and recommended timing differ among regional systems. Cornell's NEWA model uses a user-entered biofix and identifies treatment windows; Cornell's fact sheet associates about 250 DD50 after biofix with roughly 3% egg hatch. Penn State lists a broader 250–350 DD50 timing for a broad-spectrum first application and earlier timing for ovicidal materials. WSU also supports a no-biofix model that accumulates from January 1. A useful TFPM answer therefore needs the user's state or preferred model before presenting a regional timing.",[sources.newa,sources.cornell,sources.psu,sources.wsu],["Mid-Atlantic guidance","New York guidance","Washington guidance","What is biofix?"]);return
      }
      if(/codling moth/.test(text)&&/(mating disruption|disrupted orchard|combo lure|high dose)/.test(text)){
        renderAnswer("Monitoring under mating disruption","Standard pheromone trap catches can be suppressed in mating-disruption blocks. Penn State recommends high-dose 10x lures or CM DA Combo lures for monitoring in disrupted orchards. Cornell notes that zero males in traps can indicate that disruption is functioning, but trap results still need to be interpreted with lure type, placement, orchard history, and fruit injury observations.",[sources.psu,sources.cornell],["Lure type","Trap placement","How to judge success","Insecticides"]);return
      }
      if(/codling moth/.test(text)&&/(insecticide|spray|control|treat)/.test(text)){
        const article=addMessage("assistant",`<p>I can summarize published insecticide information, but I need enough context to avoid mixing regional guidance or label uses.</p><p><strong>Which part do you need?</strong></p><div class="option-grid"><button type="button" class="option-button" data-option="Insecticides listed in production guides">Insecticides listed in production guides</button><button type="button" class="option-button" data-option="Application timing">Application timing</button><button type="button" class="option-button" data-option="Resistance groups">Resistance groups</button><button type="button" class="option-button" data-option="Label restrictions">Label restrictions</button></div>${refinementBox("Add crop, state or region, generation, product, or other details...")}`);wireOptions(article,"Codling moth");wireRefinement(article);return
      }
      if(/codling moth/.test(text)&&/(biology|life cycle|generation)/.test(text)){
        renderAnswer("Codling moth biology","Adults emerge and lay eggs, and newly hatched larvae enter fruit soon after hatch. Monitoring adult flight and using temperature-based models helps estimate egg hatch and larval activity. Cornell reports that there are usually two adult flights in New York, sometimes three, while generation number and timing vary with climate and season.",[sources.cornell,sources.wsu],["Identification","Damage","Degree-day timing","Monitoring"]);return
      }
      if(/codling moth/.test(text)&&/(damage|injury|fruit)/.test(text)){
        renderAnswer("Codling moth damage","Larvae bore into fruit and may feed toward the seed cavity. Infested fruit can show an entry hole with frass and may drop prematurely or be rejected at harvest. Because larvae become protected once inside the fruit, monitoring and timing information focuses on adult flight, egg hatch, and newly emerging larvae.",[sources.psu,sources.cornell],["Identification","Monitoring","Degree-day timing"]);return
      }
      if(/(phi|preharvest interval)/.test(text)){const article=addMessage("assistant",`<p><strong>Which product and crop are you asking about?</strong></p><p>PHI can differ by crop and label, so both details are needed.</p>${refinementBox("Example: Delegate on apples")}`);wireRefinement(article);return}
      renderAnswer("Test knowledge-base response","The current test knowledge set contains detailed information only for codling moth. Try entering “Codling moth,” “How do I monitor codling moth?”, “What is codling moth biofix?”, or “When is codling moth egg hatch?”",[],["Codling moth","Codling moth monitoring","Codling moth degree-day timing"])
    }
    function renderAnswer(title,answer,answerSources,followUps){const sourceItems=answerSources.map(source=>`<li><a href="${source.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.name)}</a></li>`).join(""),followButtons=followUps.map(label=>`<button type="button" class="option-button" data-option="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join(""),sourceBlock=sourceItems?`<strong>Sources:</strong><ul class="source-list">${sourceItems}</ul>`:"";const article=addMessage("assistant",`<div class="answer-card"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(answer)}</p></div>${sourceBlock}<p style="margin-top:16px"><strong>Was this what you wanted?</strong></p><div class="feedback-row"><button type="button" class="secondary-button" data-feedback="yes">Yes</button><button type="button" class="secondary-button" data-feedback="no">Not quite</button></div><div class="option-grid">${followButtons}</div>${refinementBox("Enter more information or clarify what you need...")}`);wireOptions(article,"");wireRefinement(article);article.querySelector('[data-feedback="yes"]').addEventListener("click",()=>addMessage("assistant","<p>Glad that answered it. Enter another topic or question whenever you’re ready.</p>"));article.querySelector('[data-feedback="no"]').addEventListener("click",()=>article.querySelector(".refinement-row input").focus())}
    function wireRefinement(article){const form=article.querySelector(".refinement-box");if(!form)return;form.addEventListener("submit",event=>{event.preventDefault();const input=form.querySelector("input"),value=input.value.trim();if(value)processEntry(value)})}
    function wireOptions(article,context){article.querySelectorAll("[data-option]").forEach(button=>button.addEventListener("click",()=>{const selection=button.dataset.option;processEntry(context?`${context}: ${selection}`:selection)}))}
    function processEntry(value){addMessage("user",`<p>${escapeHtml(value)}</p>`);searchInput.value="";if(looksLikeQuestion(value)||value.includes(":")){answerQuestion(value);return}const type=topicType(value);type==="unclear"?renderUnclearTopic(value):renderTopicClarification(value,type)}
    function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    searchForm.addEventListener("submit",event=>{event.preventDefault();const value=searchInput.value.trim();if(!value){searchInput.focus();return}processEntry(value)});
    restartBtn.addEventListener("click",()=>{conversation.innerHTML="";searchInput.value="";searchInput.focus()});
    searchInput.focus();
  </script>
</body>
</html>
